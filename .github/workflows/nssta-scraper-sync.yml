name: NSSTA Circulars Scraper & Intelligence Sync

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC — covers Indian Standard Time working hours)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual sync trigger'
        required: false
        default: 'On-demand jury/admin manual trigger'

concurrency:
  group: nssta-scraper-sync
  cancel-in-progress: false

jobs:
  sync-nssta:
    name: Crawl MoSPI / NSSTA Circulars
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name:  Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: 📦 Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: 🔄 Execute NSSTA Scraper & Deduplication Ingestion
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: npm run sync:nssta
