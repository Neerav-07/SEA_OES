services:
  postgres:
    image: postgres:16-alpine
    container_name: oes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oes_db
    ports:
      - '5434:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d oes_db']
      interval: 3s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: oes_server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/oes_db
      JWT_SECRET: ${JWT_SECRET:-local-oes-preview-change-me}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      OES_DEMO_EXAMINER_PASSWORD: ${OES_DEMO_EXAMINER_PASSWORD:-Examiner@123!}
      OES_DEMO_STUDENT_PASSWORD: ${OES_DEMO_STUDENT_PASSWORD:-Student@123!}
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: oes_client
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  pg_data:

