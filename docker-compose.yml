version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kshamata_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kshamata_db
    ports:
      - '5433:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kshamata_server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kshamata_db
      JWT_SECRET: super_secret_kshamata_jwt_token_key_2026
      CLIENT_URL: http://localhost:80
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kshamata_client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  pg_data:
